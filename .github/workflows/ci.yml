# CI does NOT validate this plugin.
#
# Orca is not installed on GitHub-hosted runners, so this workflow cannot run
# `orca plugin validate .`, `orca plugin test .`, or `orca plugin check .` — the
# commands that actually prove the manifest is well-formed, the panel renders, and
# the plugin's 111 tests pass. A green check here is NOT evidence that the plugin
# works in Orca.
#
# Those commands run locally, where Orca is installed, and are the project's
# pre-tag checklist — see the "Pre-tag checklist" section of README.md. Run them,
# and confirm by ear in a real Orca session, before tagging a release.
#
# What this workflow actually does, as the next most useful honest thing:
#
# 1. Every worker/*.test.ts and src/*.test.tsx file imports `test`/`assert`/etc.
#    from `orca/testing`, which only resolves inside Orca's plugin runtime. There
#    is no dependency-free test file in this repo that `node --test` can run
#    standalone, so this job does not run the test suite at all — it would either
#    fail to resolve `orca/testing` or (worse) silently run nothing.
# 2. Instead it does a syntax-only parse pass with `node --check` (via
#    `--experimental-strip-types`) over every non-JSX TypeScript source file, which
#    catches typos and syntax errors without needing `orca` to resolve. `.tsx`
#    files (the panel and its test) are skipped: Node's `--check` does not strip
#    JSX, and `orca plugin check .` is what actually renders the panel.
# 3. It also checks that `orca-plugin.json` is valid JSON and has the manifest
#    fields the plugin loader requires. This is a structural sanity check, not a
#    schema validation against Orca's actual plugin schema — that happens in
#    `orca plugin validate .`.

name: CI

on:
  push:
  pull_request:

jobs:
  parse-and-manifest-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check TypeScript sources (no orca runtime, no test execution)
        run: |
          set -e
          status=0
          while IFS= read -r -d '' file; do
            echo "checking $file"
            if ! node --experimental-strip-types --check "$file"; then
              echo "::error file=$file::failed syntax check"
              status=1
            fi
          done < <(find worker src -type f -name '*.ts' -print0 | sort -z)
          exit "$status"

      - name: Sanity-check orca-plugin.json
        run: |
          node --eval "
            const fs = require('node:fs');
            const manifest = JSON.parse(fs.readFileSync('orca-plugin.json', 'utf8'));
            const requiredStrings = ['id', 'name', 'version', 'license', 'main'];
            const missing = requiredStrings.filter((key) => typeof manifest[key] !== 'string' || manifest[key].length === 0);
            if (manifest.manifestVersion !== 2) missing.push('manifestVersion (expected 2)');
            if (!Array.isArray(manifest.capabilities) || manifest.capabilities.length === 0) missing.push('capabilities (non-empty array)');
            if (!manifest.contributes || typeof manifest.contributes !== 'object') missing.push('contributes (object)');
            if (missing.length > 0) {
              console.error('orca-plugin.json is missing or malformed: ' + missing.join(', '));
              process.exit(1);
            }
            console.log('orca-plugin.json parses and has the expected top-level shape.');
          "
